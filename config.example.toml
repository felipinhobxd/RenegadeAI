[melonds]
window_title = "melonDS"
focus_before_input = true
press_seconds = 0.06
# Directions need a slightly longer hold on stock melonDS.
direction_press_seconds = 0.14
# auto = native Windows scan-code input on Windows, PyAutoGUI elsewhere.
input_backend = "auto"

# These are common keyboard bindings, but melonDS lets you remap every key.
# Make these match Config > Input and hotkeys > DS keypad in your installation.
[melonds.keys]
a = "x"
b = "z"
x = "s"
y = "a"
l = "q"
r = "w"
select = "backspace"
start = "enter"
up = "up"
down = "down"
left = "left"
right = "right"

# Crop pixels from the OUTER melonDS window before perception.
# Start with zero. RenegadeAI now automatically finds the centered DS viewport
# and removes the black bars/title/menu chrome after this optional manual crop.
[capture]
inset_left = 0
inset_top = 0
inset_right = 0
inset_bottom = 0
screen_layout = "vertical"

[learning]
database = "data/experience.sqlite3"
qtable = "data/qtable.json"
alpha = 0.20
gamma = 0.95
epsilon = 0.10
