# Copy this file to config.toml only when you need to override defaults.
# RenegadeAI v0.5 autoplay works with these defaults and can start without a
# config.toml. The background watcher simply waits until a melonDS window exists.

[melonds]
window_title = "melonDS"
focus_before_input = true
press_seconds = 0.06
direction_press_seconds = 0.14
# auto = native Windows SendInput on Windows, PyAutoGUI elsewhere
input_backend = "auto"

[melonds.keys]
a = "x"
b = "z"
x = "s"
y = "a"
l = "q"
r = "w"
select = "backspace"
start = "enter"
up = "up"
down = "down"
left = "left"
right = "right"

[capture]
# Insets normally remain zero because the viewport detector removes melonDS
# window chrome/black bars automatically.
inset_left = 0
inset_top = 0
inset_right = 0
inset_bottom = 0
screen_layout = "vertical"

[learning]
database = "data/experience.sqlite3"
qtable = "data/qtable.json"
alpha = 0.20
gamma = 0.95
epsilon = 0.10
